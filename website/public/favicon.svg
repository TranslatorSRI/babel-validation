<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Babel Validation">
  <!-- The dashboard in miniature: a grid of test outcomes across environments,
       mostly passing, one failing. -->
  <style>
    .plate { fill: #212529; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #e9ecef; }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="7" />
  <g>
    <rect x="5" y="8" width="6" height="6" rx="1.5" fill="#75b798" />
    <rect x="13" y="8" width="6" height="6" rx="1.5" fill="#75b798" />
    <rect x="21" y="8" width="6" height="6" rx="1.5" fill="#ffda6a" />
    <rect x="5" y="18" width="6" height="6" rx="1.5" fill="#75b798" />
    <rect x="13" y="18" width="6" height="6" rx="1.5" fill="#75b798" />
    <rect x="21" y="18" width="6" height="6" rx="1.5" fill="#ea868f" />
  </g>
</svg>
