# This file defines the possible targets of these tests.
#
# To simplify things, we set up targets that simultaneously define NodeNorm and NameRes settings.
# And then tests can use both settings, but are more likely to only use whichever server they
# actually want to test.
#
# We define five environments:
# - prod: Production (https://nodenorm.transltr.io/docs, https://name-lookup.transltr.io/docs)
# - test: Test (https://nodenorm-es.test.transltr.io/, https://name-lookup.test.transltr.io/docs)
# - ci: CI (https://nodenorm-es.ci.transltr.io/, https://name-lookup.ci.transltr.io/docs)
# - dev: Development (https://nodenormalization-sri.renci.org/docs, https://name-resolution-sri.renci.org/docs)
# - exp: Experimental (https://nodenormalization-dev.apps.renci.org/docs, https://name-resolution-sri-dev.apps.renci.org/docs)
#
# NodeNorm and NameRes each come in a Redis/Solr-backed and an Elasticsearch-backed
# flavour, and both are supported for the foreseeable future: validating them against
# each other, and catching drift between them, is one of the reasons this repo exists.
# So an -es entry below is not a migration in progress that will one day be tidied
# away — it is one of the two things we test. Where the two differ, that difference is
# recorded per target here rather than inferred from the hostname.

[DEFAULT]
NameResLimit = 20
NameResXFailIfInTop = 5
# Which backend each target is expected to be talking to, checked against what
# /status reports (deployments too old to report one are skipped). Set this when a
# target is pointed at a different flavour, and set the OpenAPI path below to match.
NodeNormBackend = redis
# Where each service serves its OpenAPI document, relative to its base URL. The
# Redis/Solr-backed deployments use FastAPI's default of openapi.json at the root; the
# Elasticsearch-backed ones answer the API itself at the root but publish their document
# at webapp/openapi.json (and serve no /docs at all). Getting this wrong is a 404 rather
# than a wrong answer, so it is worth stating rather than probing for.
NodeNormOpenAPIPath = openapi.json
NameResOpenAPIPath = openapi.json
# GitHub repositories to scan for embedded BabelTest assertions.
# One "org/repo" per line. Read from this DEFAULT section only — the GitHub
# issue tests do not support per-environment overrides.
Repositories =
    NCATSTranslator/Babel
    NCATSTranslator/NodeNormalization
    NCATSTranslator/NameResolution
    TranslatorSRI/babel-validation
    TranslatorSRI/babel-explorer

[prod]
NodeNormURL = https://nodenorm.transltr.io/
NameResURL = https://name-lookup.transltr.io/

# Test matches CI: NodeNorm ES against the Solr-backed NameRes. The Redis-backed
# nodenorm.test.transltr.io was turned off on 2026-08-31, so there is no Redis
# NodeNorm here to compare against — dev, exp and prod still run one. NameRes ES
# is deliberately absent: it is being validated in CI ([ci-es]) before it goes
# any further.
[test]
NodeNormURL = https://nodenorm-es.test.transltr.io/
NodeNormBackend = elasticsearch
NodeNormOpenAPIPath = webapp/openapi.json
NameResURL = https://name-lookup.test.transltr.io/

# nodenorm-es has completely replaced the Redis-backed nodenorm.ci.
[ci]
NodeNormURL = https://nodenorm-es.ci.transltr.io/
NodeNormBackend = elasticsearch
NodeNormOpenAPIPath = webapp/openapi.json
NameResURL = https://name-lookup.ci.transltr.io/

# The same, but against the Elasticsearch NameLookup we are validating. Once
# namelookup-es is signed off, this section goes away and [ci] points at both
# -es instances.
[ci-es]
NodeNormURL = https://nodenorm-es.ci.transltr.io/
NodeNormBackend = elasticsearch
NodeNormOpenAPIPath = webapp/openapi.json
NameResURL = https://namelookup-es.ci.transltr.io/
NameResOpenAPIPath = webapp/openapi.json

[dev]
NodeNormURL = https://nodenormalization-sri.renci.org/
NameResURL = https://name-resolution-sri.renci.org/

[exp]
NodeNormURL = https://nodenormalization-exp.apps.renci.org/
NameResURL = https://name-resolution-exp.apps.renci.org/

[localhost]
NodeNormURL = http://localhost:2434/
NameResURL = http://localhost:2433/
